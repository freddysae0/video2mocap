<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>video2mocap viewer</title>
<style>
  :root { --bg:#111214; --panel:#1b1d21; --fg:#e8e8e6; --dim:#8b8f96; --accent:#ff5a4e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { padding:10px 16px; display:flex; gap:16px; align-items:center; border-bottom:1px solid #2a2d33; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  #people { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { display:flex; align-items:center; gap:6px; padding:3px 10px; border-radius:99px; background:var(--panel); cursor:pointer; user-select:none; }
  .chip i { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .chip.off { opacity:.35; }
  main { flex:1; display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1.4fr); gap:8px; padding:8px; min-height:0; }
  .pane { position:relative; background:#000; border-radius:8px; overflow:hidden; min-height:0; }
  #videoPane { display:flex; align-items:center; justify-content:center; }
  #videoBox { position:relative; max-width:100%; max-height:100%; }
  video { display:block; max-width:100%; max-height:calc(100vh - 140px); }
  #overlay { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #three { width:100%; height:100%; display:block; }
  .label { position:absolute; left:10px; top:8px; color:var(--dim); font-size:12px; }
  footer { padding:8px 16px 12px; display:flex; gap:12px; align-items:center; }
  button { background:var(--panel); color:var(--fg); border:1px solid #2f3238; border-radius:6px; padding:6px 12px; cursor:pointer; }
  input[type=range] { flex:1; accent-color: var(--accent); }
  #info { color:var(--dim); font-variant-numeric: tabular-nums; min-width:180px; text-align:right; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><h1>video2mocap</h1><div id="people"></div></header>
<main>
  <div class="pane" id="videoPane"><span class="label">vídeo + monigotes</span>
    <div id="videoBox"><video id="video" muted playsinline></video><canvas id="overlay"></canvas></div>
  </div>
  <div class="pane"><span class="label">animación 3D (arrastra para girar)</span><canvas id="three"></canvas></div>
</main>
<footer>
  <button id="play">▶︎</button>
  <button id="slow">1×</button>
  <input id="seek" type="range" min="0" value="0" step="1">
  <span id="info"></span>
</footer>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const data = await (await fetch("viewer.json")).json();
const video = document.getElementById("video");
video.src = data.video;
const overlay = document.getElementById("overlay"), ctx = overlay.getContext("2d");
const seek = document.getElementById("seek"); seek.max = data.frames - 1;
const visible = data.people.map(() => true);

// ---------- people chips
const chips = document.getElementById("people");
data.people.forEach((p, i) => {
  const c = document.createElement("div");
  c.className = "chip";
  c.innerHTML = `<i style="background:${p.color}"></i>${p.name} <span style="color:#8b8f96">f${p.frame_start}-${p.frame_end}</span>`;
  c.onclick = () => { visible[i] = !visible[i]; c.classList.toggle("off", !visible[i]); draw(); };
  chips.appendChild(c);
});

// ---------- 3D scene
const canvas = document.getElementById("three");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(devicePixelRatio);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171a);
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 500);
const controls = new OrbitControls(camera, canvas);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(3, 6, 4); scene.add(sun);
const grid = new THREE.GridHelper(60, 60, 0x3a3e45, 0x262a30); scene.add(grid);

const figures = data.people.map(p => {
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: p.color, roughness: .55 });
  const jointMat = new THREE.MeshStandardMaterial({ color: 0xf2f2f0, roughness: .5 });
  const contactMat = new THREE.MeshStandardMaterial({ color: 0x53d18b, emissive: 0x1f6b40 });
  const bones = [], joints = [];
  p.parents.forEach((par, j) => {
    const n = p.names[j].toLowerCase();
    const small = /thumb|index|middle|ring|pinky|eye|jaw|end/.test(n);
    const r = /head$/.test(n) ? 0.09 : small ? 0.006 : 0.025;
    const s = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 8), jointMat);
    group.add(s); joints.push(s);
    if (par >= 0) {
      const cyl = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 8), mat);
      cyl.userData = { j, par, r: small ? 0.005 : 0.02 };
      group.add(cyl); bones.push(cyl);
    }
  });
  scene.add(group);
  return { group, bones, joints, contactMat, jointMat };
});

const up = new THREE.Vector3(0, 1, 0), a = new THREE.Vector3(), b = new THREE.Vector3();
function pos(p, f, j, out) { const q = p.pos[f][j]; return out.set(q[0] / 1000, q[1] / 1000, q[2] / 1000); }

let followTarget = null;
function draw3d(frame) {
  const centre = new THREE.Vector3(); let n = 0;
  data.people.forEach((p, i) => {
    const fig = figures[i], f = frame - p.frame_start;
    const on = visible[i] && f >= 0 && f < p.pos.length;
    fig.group.visible = on;
    if (!on) return;
    fig.joints.forEach((s, j) => {
      pos(p, f, j, s.position);
      const name = p.names[j];
      s.material = p.contacts[name] && p.contacts[name][f] ? fig.contactMat : fig.jointMat;
    });
    fig.bones.forEach(c => {
      pos(p, f, c.userData.par, a); pos(p, f, c.userData.j, b);
      const d = b.clone().sub(a), len = d.length();
      c.position.copy(a).addScaledVector(d, .5);
      c.scale.set(c.userData.r, Math.max(len, 1e-4), c.userData.r);
      c.quaternion.setFromUnitVectors(up, d.normalize());
    });
    centre.add(pos(p, f, 0, a)); n++;
  });
  if (n) {
    centre.divideScalar(n);
    if (!followTarget) {
      followTarget = centre.clone(); controls.target.copy(centre);
      camera.position.set(centre.x + 3, centre.y + 0.8, centre.z + 4);
    }
    const delta = centre.clone().sub(followTarget); delta.y = 0;  // camera follows the group
    camera.position.add(delta); controls.target.add(delta); followTarget.add(delta);
  }
}

// ---------- 2D overlay
function draw2d(frame) {
  const box = video.getBoundingClientRect();
  overlay.width = box.width * devicePixelRatio; overlay.height = box.height * devicePixelRatio;
  ctx.setTransform(overlay.width / data.width, 0, 0, overlay.height / data.height, 0, 0);
  ctx.clearRect(0, 0, data.width, data.height);
  ctx.lineCap = "round";
  data.people.forEach((p, i) => {
    const f = frame - p.frame_start;
    if (!visible[i] || f < 0 || f >= p.uv.length) return;
    const uv = p.uv[f];
    ctx.strokeStyle = p.color; ctx.lineWidth = Math.max(2, data.width / 300);
    p.parents.forEach((par, j) => {
      if (par < 0 || /thumb|index|middle|ring|pinky|eye|jaw|end/i.test(p.names[j])) return;
      const u = uv[j], v = uv[par];
      if (u[0] < -9999 || v[0] < -9999) return;
      ctx.beginPath(); ctx.moveTo(v[0], v[1]); ctx.lineTo(u[0], u[1]); ctx.stroke();
    });
    const h = uv[p.names.indexOf("Head")];
    if (h && h[0] > -9999) { ctx.fillStyle = p.color; ctx.font = `${Math.max(14, data.width / 40)}px system-ui`; ctx.fillText(p.name, h[0] + 8, h[1] - 12); }
  });
}

function currentFrame() { return Math.min(data.frames - 1, Math.floor(video.currentTime * data.fps + 1e-3)); }
function draw() {
  const f = currentFrame();
  seek.value = f;
  document.getElementById("info").textContent = `frame ${f} / ${data.frames - 1}  ·  ${video.currentTime.toFixed(2)} s`;
  draw2d(f); draw3d(f);
}

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", () => { resize(); draw(); });

const playBtn = document.getElementById("play");
playBtn.onclick = () => video.paused ? video.play() : video.pause();
video.onplay = () => playBtn.textContent = "❚❚";
video.onpause = () => playBtn.textContent = "▶︎";
const speeds = [1, 0.5, 0.25];
document.getElementById("slow").onclick = e => {
  const s = speeds[(speeds.indexOf(video.playbackRate) + 1) % speeds.length];
  video.playbackRate = s; e.target.textContent = `${s}×`;
};
seek.oninput = () => { video.pause(); video.currentTime = (+seek.value + 0.5) / data.fps; };
addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); playBtn.click(); }
  if (e.code === "ArrowRight" || e.code === "ArrowLeft") {
    video.pause(); video.currentTime = Math.max(0, video.currentTime + (e.code === "ArrowRight" ? 1 : -1) / data.fps);
  }
});

video.onloadedmetadata = () => { resize(); draw(); };
(function loop() { draw(); controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
</script>
</body>
</html>
